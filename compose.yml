services:
  db:
    image: mariadb:13
    container_name: wordpress-db
    restart: unless-stopped
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${SQL_ROOT_PASSWORD}
      MARIADB_DATABASE: wordpress
      MARIADB_USER: ${SQL_USER}
      MARIADB_PASSWORD: ${SQL_PASSWORD}
    networks:
      - local-wp-network

  wordpress:
    depends_on:
      - db
    image: wordpress:php8.4-fpm-alpine
    container_name: wordpress
    restart: unless-stopped
    volumes:
      - wordpress:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: ${SQL_USER}
      WORDPRESS_DB_PASSWORD: ${SQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '1G');
    networks:
      - local-wp-network

  nginx:
    depends_on:
      - wordpress
    image: nginx:stable-alpine
    container_name: wp-nginx
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - wordpress:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - local-wp-network

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:8080
    networks:
      - local-wp-network

volumes:
  wordpress:
  dbdata:

networks:
  local-wp-network:
    driver: bridge
